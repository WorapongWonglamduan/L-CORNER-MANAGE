  #     NODE_ENV: ${NODE_ENV:-development}
  #     DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-l_corner_pos}?schema=public
  #     NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3077}
  #     NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #     - /app/.next
  #   networks:
  #     - l-corner-network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: npm run dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: l-corner-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lcorner.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - l-corner-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  l-corner-network:
    driver: bridge
