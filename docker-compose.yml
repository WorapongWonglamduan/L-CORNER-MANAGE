services:
  postgres:
    image: postgres:17-alpine
    # ENV_SUFFIX (e.g. "-uat") lets a second copy of this same compose file
    # run on the same VPS — without it, a UAT stack would collide with
    # prod's container names/volume outright. Left unset, this is byte-for-
    # byte the prod name it always was.
    container_name: l-corner-postgres${ENV_SUFFIX:-}
    restart: unless-stopped
    ports:
      # Bound to loopback only — this DB must never be reachable from the
      # public internet. Use an SSH tunnel (ssh -L 5435:localhost:5435 ...)
      # from a local machine to reach it with a GUI client (DBeaver/pgAdmin).
      # POSTGRES_HOST_PORT lets a second (UAT) stack on the same VPS bind a
      # different host port instead of colliding on 5435.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-l_corner_pos}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - l-corner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production container built from the multi-stage Dockerfile (Next.js
  # standalone output) — `docker compose up -d` runs the real app, not just
  # Postgres. Was commented out before with `DATABASE_URL` + a dev-mode bind
  # mount + `command: npm run dev`, none of which match how this app
  # actually runs: src/lib/prisma.ts builds its pg.Pool from the individual
  # DB_HOST/DB_PORT/... vars (there's no `url = env("DATABASE_URL")` in
  # schema.prisma), and the Dockerfile already produces a standalone
  # production build — bind-mounting host source over that would replace
  # the compiled output with raw source and Windows-built node_modules.
  app:
    # Must match the lowercased image the GitHub Actions workflow pushes to
    # GHCR (deploy.yml lowercases github.repository) — this is what makes
    # `docker compose pull app` on the VPS actually fetch anything; without
    # it, compose has no registry reference to pull from at all. IMAGE_TAG
    # defaults to prod's `latest`; a UAT stack sets IMAGE_TAG=staging to
    # pull the tag deploy.yml pushes for the `staging` branch instead.
    image: ghcr.io/worapongwonglamduan/l-corner-manage:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build ARGs, not just runtime environment
      # (see the Dockerfile builder stage and the note below) — only takes
      # effect on `docker compose build`; the actual production image comes
      # from GitHub Actions (build-args set there via repo Variables), which
      # this compose file's `app` service only ever pulls, never builds.
      args:
        NEXT_PUBLIC_OMISE_PUBLIC_KEY: ${NEXT_PUBLIC_OMISE_PUBLIC_KEY:-}
        NEXT_PUBLIC_PAYPAL_ENABLED: ${NEXT_PUBLIC_PAYPAL_ENABLED:-false}
        # Same NEXT_PUBLIC_* build-time rule — must be a build arg, not just
        # runtime environment, for src/lib/payments/paypal-driver.ts's
        # redirect URLs to ever be correct in a built image.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3077}
    # See the ENV_SUFFIX note on the postgres service above — this is also
    # the hostname Caddy's reverse_proxy block targets on shared-proxy, so a
    # UAT stack's Caddy block must reference l-corner-app-uat, not this name.
    container_name: l-corner-app${ENV_SUFFIX:-}
    restart: unless-stopped
    # No host port published here on purpose — the shared reverse-proxy
    # stack (see deploy/reverse-proxy/) is the only thing that should be
    # internet-facing. This service is reachable from it via shared-proxy.
    expose:
      - "3000"
    environment:
      # Was hardcoded `production` for every stack — now reads from this
      # stack's own .env (default stays production) so a UAT .env can set
      # NODE_ENV=development to show the login page's test-account box
      # there without affecting prod. Deliberate tradeoff: this also flips
      # useSecureCookies/secureCookie (auth.ts, proxy.ts) and any Next.js
      # internal behavior gated on NODE_ENV === 'production' for that stack.
      NODE_ENV: ${NODE_ENV:-production}
      # Baked into the Dockerfile too (tzdata + ENV TZ) — repeated here so
      # it's visible/overridable without a rebuild. Every "local day
      # boundary" date calculation in this app assumes the process clock
      # reads Asia/Bangkok wall-clock time.
      TZ: Asia/Bangkok
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-l_corner_pos}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3077}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # "local" (default, uploads_data volume below) or "r2" — see
      # env.template for what the R2_* vars need to be. Left unset/empty
      # is harmless when STORAGE_DRIVER=local; src/lib/storage only reads
      # them when actually asked to use the r2 driver.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # Payment gateways (src/lib/payments) — see env.template. Note:
      # NEXT_PUBLIC_OMISE_PUBLIC_KEY / NEXT_PUBLIC_PAYPAL_ENABLED are also
      # wired as build args above (`app.build.args`) — Next.js inlines
      # NEXT_PUBLIC_* vars into the client bundle during the build, not at
      # container runtime, so setting them only here would have no effect.
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
      OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY:-}
      OMISE_WEBHOOK_SECRET: ${OMISE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-}
    volumes:
      # Uploaded product images are written at runtime under
      # public/uploads/<year>/<month>/... (src/lib/image-upload.ts) — without
      # this, every upload lives only inside the container's writable layer
      # and vanishes the next time the image is rebuilt/recreated.
      - uploads_data:/app/public/uploads
    networks:
      # l-corner-network: talks to this project's own postgres, invisible to
      # anything outside this compose file.
      # shared-proxy: the one network the reverse-proxy stack also joins, so
      # it can route pos.yourdomain.com here. Created once on the host with
      # `docker network create shared-proxy` (see deploy/reverse-proxy/) —
      # `external: true` means this compose file expects it to already
      # exist rather than trying to own/create it itself.
      - l-corner-network
      - shared-proxy
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Bumping to postgres:17-alpine left the previous postgres_data volume on
  # PG16 (incompatible file format) — pg_upgrade'd it into this volume rather
  # than reinitializing, so local dev data survives. The old PG16 volume
  # (l-corner-manage_postgres_data) is left in place as a backup, not deleted.
  #
  # Note: the pg_upgrade helper's own initdb wrote a pg_hba.conf that only
  # trusts 127.0.0.1/::1 — unlike the official image's fresh-init path, it
  # never adds a rule for the wider docker network, so the app (running on
  # the host, connecting through the forwarded port) got "denied access"
  # until a `host all all all trust` line was appended manually inside the
  # container. That edit lives in the volume itself, not in this repo — if
  # this volume is ever recreated from scratch, this note is the reminder.
  postgres_data:
    name: l-corner-manage_postgres_data_pg17${ENV_SUFFIX:-}
    driver: local
  pgadmin_data:
    driver: local
  uploads_data:
    driver: local

networks:
  l-corner-network:
    driver: bridge
  # Owned by deploy/reverse-proxy/docker-compose.yml, not this file. Create
  # it once, by hand, before starting either stack:
  #   docker network create shared-proxy
  shared-proxy:
    external: true
