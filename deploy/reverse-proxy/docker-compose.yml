services:
  # The one internet-facing thing on this VPS — every project's app service
  # joins `shared-proxy` (external network, created once below) instead of
  # publishing its own port 80/443, so adding/removing a project never
  # touches this stack or any other project's.
  caddy:
    image: caddy:2-alpine
    container_name: shared-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-proxy

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  # `external: true` — NOT created by this compose file. Create it once, by
  # hand, before starting anything: `docker network create shared-proxy`.
  # Every project's own docker-compose.yml joins this same network by name.
  shared-proxy:
    external: true
