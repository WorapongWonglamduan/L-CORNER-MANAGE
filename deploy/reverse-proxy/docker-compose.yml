services:
  # The one internet-facing thing on this VPS — every project's app service
  # joins `shared-proxy` (external network, created once below) instead of
  # publishing its own port 80/443, so adding/removing a project never
  # touches this stack or any other project's.
  caddy:
    image: caddy:2-alpine
    container_name: shared-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-proxy

  # Only needed on a VPS with no public IP, reached over Cloudflare Tunnel
  # instead of Caddy's own 80/443 above being internet-facing (see the
  # Caddyfile's http:// comment) — a VPS with a real public IP doesn't need
  # this service at all. `./cloudflared/` (config.yml + the tunnel's
  # credentials .json) is created once by hand on the host, per the tunnel
  # bootstrap steps in this directory's README, and is gitignored — it's
  # host-specific and holds the tunnel's credentials, not something to check
  # in like the Caddyfile.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shared-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - shared-proxy

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  # `external: true` — NOT created by this compose file. Create it once, by
  # hand, before starting anything: `docker network create shared-proxy`.
  # Every project's own docker-compose.yml joins this same network by name.
  shared-proxy:
    external: true
