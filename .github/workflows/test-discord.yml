name: Test Discord Webhook

on: workflow_dispatch

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -i -H "Content-Type: application/json" -X POST "$WEBHOOK" \
            -d '{"content": "ทดสอบจาก GitHub Actions - ถ้าเห็นข้อความนี้แปลว่า webhook ใช้งานได้แล้ว"}'
