name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Matches the TZ baked into the production Dockerfile — GitHub's runners
  # default to UTC, which would silently mask (or falsely fail) any test
  # covering a local-day-boundary calculation (sale/refund numbers, date
  # range filters, dashboard "today" stats) that assumes Asia/Bangkok time.
  TZ: Asia/Bangkok

jobs:
  test:
    runs-on: ubuntu-latest
    # prisma.config.ts builds its datasource URL from these at module-load
    # time (env() throws if any is unset) — the `--url` flag below overrides
    # the URL prisma actually connects with, but doesn't stop the config file
    # itself from being evaluated first.
    env:
      DB_HOST: localhost
      DB_PORT: 5435
      DB_DATABASE: l_corner_pos_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: l_corner_pos_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma db push --url="postgresql://postgres:postgres@localhost:5435/l_corner_pos_test?schema=public"
      - run: npm test

  build-and-push:
    needs: test
    # pull_request runs only exist to gate the PR on `test` above — nothing
    # to build/push/deploy until it's actually merged to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The VPS needs its own `git pull` (not just a new image) so that
      # docker-compose.yml/Caddyfile changes ship too, not just app code.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull
            docker compose pull app
            docker compose up -d app
            docker image prune -f
