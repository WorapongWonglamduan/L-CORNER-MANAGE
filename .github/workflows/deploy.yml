name: Build and deploy

on:
  push:
    # staging deploys to a second (UAT) stack on the same VPS, under its own
    # image tag/directory — see the branch-conditional steps below. Never
    # add develop/feature branches here: those still only get the `test` job
    # via pull_request, matching the "PR into develop, no deploy" convention.
    branches: [main, staging]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Matches the TZ baked into the production Dockerfile — GitHub's runners
  # default to UTC, which would silently mask (or falsely fail) any test
  # covering a local-day-boundary calculation (sale/refund numbers, date
  # range filters, dashboard "today" stats) that assumes Asia/Bangkok time.
  TZ: Asia/Bangkok

jobs:
  test:
    runs-on: ubuntu-latest
    # prisma.config.ts builds its datasource URL from these at module-load
    # time (env() throws if any is unset) — the `--url` flag below overrides
    # the URL prisma actually connects with, but doesn't stop the config file
    # itself from being evaluated first.
    env:
      DB_HOST: localhost
      DB_PORT: 5435
      DB_DATABASE: l_corner_pos_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: l_corner_pos_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # db push alone doesn't regenerate the client here, and @prisma/client
      # is unusable (no .prisma/client/default) until this has run.
      - run: npx prisma generate
      - run: npx prisma db push --url="postgresql://postgres:postgres@localhost:5435/l_corner_pos_test?schema=public"
      - run: npm test

  build-and-push:
    needs: test
    # pull_request runs only exist to gate the PR on `test` above — nothing
    # to build/push/deploy until it's actually merged to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR (and OCI registries generally) require lowercase repository
      # names — github.repository preserves this repo's actual case
      # (L-CORNER-MANAGE), so the raw IMAGE env above isn't a valid tag.
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # main -> prod's `latest` tag; staging -> a separate `staging` tag, so
      # the two environments' images (and IMAGE_TAG in each stack's own
      # .env, see env.template) never overwrite each other on GHCR.
      - name: Resolve image tag from branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
          else
            echo "TAG=staging" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Next.js inlines NEXT_PUBLIC_* vars at build time — these must be
          # repo Variables (Settings → Secrets and variables → Actions →
          # Variables), not Secrets, since both are safe to expose client-side
          # (env.template explains why) and `vars.*` (unlike `secrets.*`)
          # renders as an empty string rather than erroring when unset.
          build-args: |
            NEXT_PUBLIC_OMISE_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_OMISE_PUBLIC_KEY }}
            NEXT_PUBLIC_PAYPAL_ENABLED=${{ vars.NEXT_PUBLIC_PAYPAL_ENABLED }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The VPS needs its own `git pull` (not just a new image) so that
      # docker-compose.yml/Caddyfile changes ship too, not just app code.
      # main -> VPS_APP_DIR (prod); staging -> VPS_APP_DIR_UAT (a second,
      # separately cloned checkout on the same VPS — see env.template's
      # ENV_SUFFIX/POSTGRES_HOST_PORT/IMAGE_TAG for how it avoids colliding
      # with prod's containers/volume/port).
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd ${{ secrets.VPS_APP_DIR }}
            else
              cd ${{ secrets.VPS_APP_DIR_UAT }}
            fi
            git pull
            docker compose pull app
            docker compose up -d app
            docker image prune -f

  notify:
    needs: [test, build-and-push, deploy]
    # always() so this still fires when an earlier job failed — otherwise a
    # failed test/build would just skip straight past the notification too.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          # This job has no branch filter (fires for both main and staging)
          # so every title below must say which environment, not just
          # "production" — otherwise a UAT deploy notification reads as if
          # it shipped to real customers.
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_LABEL="Production"
          else
            ENV_LABEL="UAT"
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            TITLE="[$ENV_LABEL] Test ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs['build-and-push'].result }}" != "success" ]; then
            TITLE="[$ENV_LABEL] Build/push image ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            TITLE="[$ENV_LABEL] Deploy ล้มเหลว"; COLOR=15158332
          else
            TITLE="[$ENV_LABEL] Deploy สำเร็จ"; COLOR=3066993
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "**branch:** ${{ github.ref_name }}
          **commit:** [\`${{ github.sha }}\`]($COMMIT_URL)
          **by:** ${{ github.actor }}
          [ดู log]($RUN_URL)" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, color: $color}]}')

          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK"
