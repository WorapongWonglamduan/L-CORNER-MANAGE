name: One-time multi-tenant Shop migration

# Manual-only, click-to-run tool for the one-time real-data migration a
# database needs the FIRST time it picks up the multi-tenant Shop schema —
# see [[l-corner-manage-status]]. A plain `prisma db push` (the recurring
# migrate-db job in deploy.yml) can't do this alone: the real schema has
# shop_id as a REQUIRED column, and a database that still has single-shop
# data in it (existing rows with no shop_id yet) can't have a required
# column added directly. This runs the same 3-step dance done by hand for
# local dev: nullable columns -> backfill script -> required columns.
#
# Not part of the regular deploy pipeline on purpose — this only ever needs
# to run ONCE per environment (until the next tenant ever needs the same
# treatment for some other future required-column change), not on every
# push. Gated behind the same GitHub Environment approval as migrate-db.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which stack's database to migrate"
        required: true
        type: choice
        options:
          - uat
          - prod
        default: uat

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production-db-migrate' || 'uat-db-migrate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Resolve this environment's DB port/name on the VPS
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "VPS_DB_PORT=${{ vars.PROD_DB_PORT || '5435' }}" >> "$GITHUB_ENV"
            echo "VPS_DB_DATABASE=${{ vars.PROD_DB_DATABASE || 'l_corner_pos' }}" >> "$GITHUB_ENV"
          else
            echo "VPS_DB_PORT=${{ vars.UAT_DB_PORT || '5436' }}" >> "$GITHUB_ENV"
            echo "VPS_DB_DATABASE=${{ vars.UAT_DB_DATABASE || 'l_corner_pos_uat' }}" >> "$GITHUB_ENV"
          fi

      - name: Open SSH tunnel to the VPS's Postgres
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -f -N \
            -L 5433:127.0.0.1:${{ env.VPS_DB_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}
          sleep 3

      # AppSettings' PK changed shape entirely (id="singleton" -> shop_id) —
      # not a column addition, so it can't go through the nullable-then-
      # required dance below at all. It's a disposable 1-row theme-color
      # cache with hardcoded defaults (src/lib/theme-settings.ts) — dropping
      # and letting the backfill step below recreate it is safe, same as
      # what was done for local dev.
      - name: Drop the old singleton app_settings table (recreated by the backfill step below)
        run: echo 'DROP TABLE IF EXISTS "app_settings";' | npx prisma db execute --stdin
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_DATABASE: ${{ env.VPS_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.VPS_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.VPS_DB_PASSWORD }}

      # --accept-data-loss here (unlike the recurring migrate-db job, which
      # deliberately never uses it) is a deliberate, reasoned exception: the
      # only change this flag is actually needed for is Role's uniqueness
      # constraint moving from a plain global `name` to `[shop_id, name]` —
      # every existing Role row belongs to the one pre-existing shop and has
      # a distinct name, so nothing can actually collide. Every other change
      # in this pass is purely additive (nullable columns).
      - name: "Pass 1: add shop_id as nullable everywhere"
        run: npx prisma db push --accept-data-loss --schema=prisma/schema.migrate-pass1.prisma
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_DATABASE: ${{ env.VPS_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.VPS_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.VPS_DB_PASSWORD }}

      # Creates one Shop row and backfills shop_id onto every existing row —
      # safe to assume single-tenant data at this point, since this whole
      # workflow only ever needs to run against a database that's never
      # seen the multi-tenant schema before. Not idempotent (always creates
      # a fresh Shop) — if this job is ever re-run after a failure between
      # here and the final push below, check for/clean up an orphaned extra
      # Shop row with no data pointing at it.
      - name: "Backfill: create the Shop row, fill shop_id on every existing row"
        run: npx tsx prisma/backfill-shop.ts
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_DATABASE: ${{ env.VPS_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.VPS_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.VPS_DB_PASSWORD }}

      - name: "Pass 2: make shop_id required (the real schema)"
        run: npx prisma db push
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_DATABASE: ${{ env.VPS_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.VPS_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.VPS_DB_PASSWORD }}
